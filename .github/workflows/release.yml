name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    name: Publish to RubyGems.org
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Build gem
        run: gem build skymap.gemspec
      - name: Push gem
        run: gem push skymap-*.gem
