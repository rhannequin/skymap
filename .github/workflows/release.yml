name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    name: Publish to RubyGems.org
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Configure RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@v2.1.0
      - name: Check the tag matches the gem version
        run: |
          version=$(ruby -r ./lib/skymap/version -e "puts Skymap::VERSION")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
      - name: Build gem
        run: gem build skymap.gemspec
      - name: Push gem
        run: gem push skymap-*.gem
